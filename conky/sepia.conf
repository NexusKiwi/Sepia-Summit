-- ─────────────────────────────────────────────────────────────
--  SEPIA  ·  conky hardware panel for Bazzite / KDE Plasma (Wayland)
--  Sits on the right edge of your right-hand (or only) monitor.
--  Values in @CAPS@ are filled in by install.sh.
-- ─────────────────────────────────────────────────────────────

conky.config = {
    -- Wayland output (KDE Plasma 6). See README "If it doesn't show".
    out_to_wayland = true,
    out_to_x = false,
    -- Keep visible on Show Desktop (Meta+D) — needs conky 1.25+, ignored otherwise
    own_window_namespace = 'desktop',

    -- XWayland fallback: swap the two lines above for these three
    -- out_to_wayland = false, out_to_x = true,
    -- own_window_type = 'desktop',

    own_window = true,
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '1c120c',

    alignment = 'top_right',
    xinerama_head = @HEAD@,        -- which monitor (0 = first)
    gap_x = 36,
    gap_y = 70,
    minimum_width = 360, maximum_width = 360,
    border_inner_margin = 22,
    border_outer_margin = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,

    update_interval = 1.5,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    format_human_readable = true,
    short_units = true,
    pad_percents = 2,
    top_name_width = 18,

    use_xft = true,
    font = 'Noto Sans Mono:size=10',
    font1 = 'Noto Serif:size=46:weight=light',        -- clock
    font2 = 'Noto Serif:size=11:style=Italic',       -- date
    font3 = 'Noto Sans:size=9:weight=bold',           -- section headings
    font4 = 'Noto Sans Mono:size=8',                  -- small print

    default_color = 'f5e8ca',   -- cream text
    color1 = 'c4a074',          -- tan accent / headings
    color2 = '89654a',          -- dim labels
    color3 = 'e4cca2',          -- values
    color4 = 'd9822b',          -- warm warning orange

    default_bar_width = 316, default_bar_height = 5,
    draw_graph_borders = false,
    show_graph_scale = false,
}

local S = '~/.config/conky/sepia/scripts'

conky.text = [[
${alignc}${font1}${color}${time %H:%M}${font}
${voffset -6}${alignc}${font2}${color1}${time %A, %d %B %Y}${font}
${voffset 2}${alignc}${font4}${color2}up ${uptime_short}   ·   ${kernel}${font}

${font3}${color1}P R O C E S S O R${font}${color2}${alignr}${font4}${execi 3600 grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //; s/ [0-9]*-Core.*//'}${font}
${color2}load ${color3}${cpu cpu0}%${alignr}${color2}temp ${color3}${execi 3 @S@/temps.sh cpu}°C  ${color2}clk ${color3}${freq_g}GHz
${color1}${cpubar cpu0}
${color2}${font4}${cpubar cpu1 3,34} ${cpubar cpu2 3,34} ${cpubar cpu3 3,34} ${cpubar cpu4 3,34} ${cpubar cpu5 3,34} ${cpubar cpu6 3,34} ${cpubar cpu7 3,34} ${cpubar cpu8 3,34}
${cpubar cpu9 3,34} ${cpubar cpu10 3,34} ${cpubar cpu11 3,34} ${cpubar cpu12 3,34} ${cpubar cpu13 3,34} ${cpubar cpu14 3,34} ${cpubar cpu15 3,34} ${cpubar cpu16 3,34}${font}

${font3}${color1}G R A P H I C S${font}${color2}${alignr}${font4}${execi 3600 @S@/gpu.sh name}${font}
${color2}load ${color3}${execi 2 @S@/gpu.sh util}%${alignr}${color2}temp ${color3}${execi 2 @S@/gpu.sh temp}°C  ${color2}fan ${color3}${execi 2 @S@/gpu.sh fan}%
${color1}${execibar 2 @S@/gpu.sh util}
${color2}vram ${color3}${execi 2 @S@/gpu.sh vram}${alignr}${color2}power ${color3}${execi 2 @S@/gpu.sh power}W  ${color2}core ${color3}${execi 2 @S@/gpu.sh clock}MHz
${color2}${execibar 2 @S@/gpu.sh vramperc}

${font3}${color1}M E M O R Y${font}
${color2}ram ${color3}${mem} / ${memmax}${alignr}${memperc}%
${color1}${membar}
${color2}swap ${color3}${swap} / ${swapmax}${alignr}${swapperc}%
${color2}${swapbar}

${font3}${color1}S T O R A G E${font}
${color2}home ${color3}${fs_used /var/home} / ${fs_size /var/home}${alignr}${fs_used_perc /var/home}%
${color1}${fs_bar /var/home}
@EXTRA_DRIVES@${color2}nvme temp ${color3}${execi 10 @S@/temps.sh nvme}${alignr}${color2}r ${color3}${diskio_read @DISK@}  ${color2}w ${color3}${diskio_write @DISK@}

${font3}${color1}N E T W O R K${font}${color2}${alignr}${font4}@IFACE@ · ${addr @IFACE@}${font}
${color2}down ${color3}${downspeed @IFACE@}${alignr}${color2}up ${color3}${upspeed @IFACE@}
${color2}${font4}total  ↓ ${totaldown @IFACE@}${alignr}↑ ${totalup @IFACE@}${font}

${font3}${color1}T O P${font}${alignr}${font4}${color2}cpu      mem${font}
${color3}${top name 1}${alignr}${top cpu 1}%  ${top mem 1}%
${color}${top name 2}${alignr}${top cpu 2}%  ${top mem 2}%
${color2}${top name 3}${alignr}${top cpu 3}%  ${top mem 3}%
${color2}${top name 4}${alignr}${top cpu 4}%  ${top mem 4}%
]]

conky.text = conky.text:gsub('@S@', S)
